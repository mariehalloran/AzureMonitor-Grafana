app_mode = development

[users]
auto_assign_org_role = Admin

[azure]
managed_identity_enabled = true
user_identity_enabled = true
user_identity_fallback_credentials_enabled = false

[auth.anonymous]
enabled = false
org_role = Admin

[feature_toggles]
enable = enableDatagridEditing

[server]
root_url = http://localhost:$__env{PORT}/
http_port = $__env{PORT}

[auth]
azure_auth_enabled = true 

[plugins]
allow_loading_unsigned_plugins=azure-monitor-app,azure-health-models-datasource,azure-health-model-graph-panel,azure-health-model-timeline-panel

[paths]
plugins = $__env{WORKSPACE_FOLDER}/grafana/plugins
provisioning = $__env{WORKSPACE_FOLDER}/provisioning

[navigation.app_sections]
azure-monitor-app = "root"

[database]
path = $__env{WORKSPACE_FOLDER}/grafana/data/grafana.db